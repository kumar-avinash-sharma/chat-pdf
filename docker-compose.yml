services:
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=process.env.GOOGLE_API_KEY
      - QDRANT_URL=http://qdrant:6333
      - REDIS_HOST=valkey
    depends_on:
      - qdrant
      - valkey

  worker:
    build: ./backend
    command: node worker.js
    depends_on:
      - valkey

  valkey:
    image: valkey/valkey:latest
    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"